name: coderun

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  coderun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        if: ${{ hashFiles('**/package.json') != '' }}

      - name: Install dependencies (pnpm)
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile || pnpm install

      - name: Install dependencies (npm)
        if: ${{ hashFiles('pnpm-lock.yaml') == '' && hashFiles('package-lock.json') != '' }}
        run: npm ci || npm install

      - name: Install dependencies (yarn)
        if: ${{ hashFiles('pnpm-lock.yaml') == '' && hashFiles('package-lock.json') == '' && hashFiles('yarn.lock') != '' }}
        run: |
          corepack enable
          yarn install --frozen-lockfile || yarn install

      - name: Lint
        run: |
          if [ -f package.json ]; then npm run lint --if-present; fi

      - name: Typecheck
        run: |
          if [ -f package.json ]; then npm run typecheck --if-present; fi

      - name: Test
        run: |
          if [ -f package.json ]; then npm test --if-present; fi

      - name: Build
        run: |
          if [ -f package.json ]; then npm run build --if-present; fi
